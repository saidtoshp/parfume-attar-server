<script>
const items=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n.toLocaleString("ru-RU")+" so‘m";
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function st(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let U=null,TOK=ld("attar_tok",null),cart=ld("attar_cart",{}),orders=[],S={v:"home",br:"",q:"",done:"",msg:"",mode:"in",back:"",step:0,ph:"",nm:"",pw:"",addr:"",note:"",lat:null,lng:null,pay:"cash",aa:true,pi:null,dl:"taxi",reg:"",bts:"",lm:"",f:{t:"all",v:""},pv:"home",promo:null,pc:"",pmsg:""};

let OPT={bottles:[],labels:[]},M=null,LS=ld("attar_labels",[]),LD=null,LN=ld("attar_labn",0),FAV=ld("attar_fav",[]);
const enc=encodeURIComponent,dcd=decodeURIComponent;
function pk(k){const a=k.split("~");return{id:+a[0],b:a[1]||"",l:a[2]||"",dg:a[3]||"",v:a[4]||"",o:+a[5]||0}}
const ob=id=>OPT.bottles.find(x=>x.id===id),ol=id=>OPT.labels.find(x=>x.id===id);
function unit(i,b,oil){const bo=ob(b),ml=bo?bo.ml:0;
if(i.oil){if(!(i.oilPpm>0)||!ml||!(oil>=1))return 0;return Math.round(oil*i.oilPpm+(ml-oil)*((OPT.oil||{}).vadaPpm||0))}
if(i.pr&&i.pr[ml]>0)return i.pr[ml];if(i.ppm>0&&ml)return Math.round(i.ppm*ml);return i.p>0?i.p:0}
function lineP(i,b,l,v,oil){const u=unit(i,b,oil),bo=ob(b),vr=vOf(bo,v);return u?u+(bo?bo.price||0:0)+(vr?vr.price||0:0)+(ol(l)?ol(l).price||0:0):0}
function pf(i){if(i.ppm>0)return"1 ml — "+money(i.ppm);if(i.pr&&i.pr[100]>0)return"100 ml — "+money(i.pr[100]);return i.p>0?money(i.p):""}
function feeOf(){const t=((OPT.delivery||{}).types||[]).find(x=>x.id===S.dl);return t&&t.fee>0?t.fee:0}
function norm(s){let d=s.replace(/\D/g,"");if(d.length===9)d="998"+d;return /^998\d{9}$/.test(d)?d:""}
async function api(path,body){const h={"Content-Type":"application/json"};if(TOK)h.Authorization="Bearer "+TOK;
const r=await fetch(path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined});
let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Xatolik yuz berdi");return j}
async function boot(){
if(window.Label)Label.ready().then(()=>paintCanv());
try{OPT=await api("/api/options")}catch(e){}
try{(await api("/api/products")).forEach(p=>items.push({id:p.id,b:p.brand,n:p.name,p:p.price||0,ppm:p.ppm||0,pr:p.prices||{},st:p.stock!==false,tags:p.tags||[],rec:!!p.rec,img:p.img||"",off:p.off||[],oil:!!p.oil,oilPpm:p.oilPpm||0,gift:!!p.gift,fam:p.fam||[],str:p.str||2,sea:p.sea||"A",occ:p.occ||"D",lk:p.likes||0,z:p.notes||""}))}catch(e){}

render()}
